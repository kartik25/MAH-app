<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reader</title>
<style>
  /* ---------- Theme tokens ---------- */
  :root {
    --bg: #f5f5f4;
    --panel: #ffffff;
    --ink: #1c1917;
    --muted: #a8a29e;
    --dim: #d6d3d1;
    --accent: #2563eb;
    --border: #e7e5e4;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* ---------- Top bar / controls ---------- */
  header {
    flex: 0 0 auto;
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
    z-index: 5;
  }

  .title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }

  button {
    font: inherit;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--ink);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .12s, border-color .12s, transform .04s;
  }
  button:hover { border-color: var(--muted); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.05); }
  button:disabled { opacity: .4; cursor: not-allowed; }

  .speed {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }
  .speed input[type=range] { width: 160px; accent-color: var(--accent); }
  .speed .wpm-val {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    min-width: 64px;
    text-align: right;
  }

  /* ---------- Loader (textarea) ---------- */
  .loader {
    flex: 0 0 auto;
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .loader.hidden { display: none; }
  textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    font: inherit;
    line-height: 1.5;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
  }
  .loader-row { display: flex; gap: 10px; align-items: center; }
  .hint { color: var(--muted); font-size: 13px; }

  /* ---------- Stage (shared) ---------- */
  .stage {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }

  /* ===== READ view (RSVP) ===== */
  #readView {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }
  #readView.hidden { display: none; }

  /* The reading line sits on a fixed centre point. We anchor the current
     word's centre to the middle of the screen so the eye never moves. */
  .read-line {
    display: flex;
    align-items: baseline;
    gap: 14px;
    font-size: clamp(28px, 6vw, 64px);
    font-weight: 600;
    white-space: nowrap;
  }
  .read-line .ctx { color: var(--dim); }
  .read-line .ctx.near { color: var(--muted); }
  .read-line .cur { color: var(--ink); }
  /* A small fixation marker above the centre. */
  .fixation {
    position: absolute;
    top: calc(50% - 70px);
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 26px;
    background: var(--accent);
    opacity: .5;
  }

  /* ===== PRESENT view (scrolling teleprompter) ===== */
  #presentView {
    position: absolute;
    inset: 0;
    background: #0a0a0a;
    color: #e5e5e5;
    overflow: hidden;
  }
  #presentView.hidden { display: none; }
  .present-scroll {
    padding: 40vh 8vw;          /* big top/bottom pad so first & last lines can centre */
    font-size: clamp(28px, 4.5vw, 52px);
    line-height: 1.6;
    font-weight: 600;
    transition: transform .25s ease-out;
    will-change: transform;
  }
  .present-scroll w {
    display: inline;
    color: #525252;             /* unread / read words dimmed */
    transition: color .1s;
  }
  .present-scroll w.cur {
    color: #fafafa;
    background: rgba(37,99,235,.35);
    border-radius: 4px;
    padding: 0 2px;
  }
  .present-scroll w.read { color: #8a8a8a; }

  /* ---------- Progress bar ---------- */
  .progress {
    position: absolute;
    left: 0; bottom: 0;
    height: 3px;
    width: 0%;
    background: var(--accent);
    transition: width .1s linear;
    z-index: 4;
  }

  .empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 16px;
    text-align: center;
    padding: 20px;
  }
</style>
</head>
<body>
  <header>
    <h1 class="title">Reader</h1>
    <div class="controls">
      <button id="toggleLoader">Text</button>
      <button id="viewToggle">View: Read</button>
      <span style="width:1px;height:24px;background:var(--border)"></span>
      <button id="playPause" class="primary" disabled>Play</button>
      <button id="restart" disabled>Restart</button>
      <div class="speed">
        <label for="wpm">Speed</label>
        <input id="wpm" type="range" min="60" max="900" step="10" value="350" />
        <span class="wpm-val"><span id="wpmVal">350</span> wpm</span>
      </div>
    </div>
  </header>

  <section class="loader" id="loader">
    <textarea id="input" placeholder="Paste your text here, then press Load…"></textarea>
    <div class="loader-row">
      <button id="load" class="primary">Load</button>
      <span class="hint">Tip: Space = play/pause, ← → step, R = restart.</span>
    </div>
  </section>

  <main class="stage">
    <div class="fixation" id="fixation" style="display:none"></div>

    <div id="readView">
      <div class="empty" id="readEmpty">Load some text to start reading.</div>
      <div class="read-line" id="readLine" style="display:none"></div>
    </div>

    <div id="presentView" class="hidden">
      <div class="present-scroll" id="presentScroll"></div>
    </div>

    <div class="progress" id="progress"></div>
  </main>

<script>
(function () {
  "use strict";

  /* =========================================================================
     TIMING LOGIC  (this is the part you'll want to tune)
     -------------------------------------------------------------------------
     Each word is shown for a "dwell time" in milliseconds. We build it up
     from three additive pieces:

       dwell = base + lengthBonus + punctuationBonus

     1) base: derived from words-per-minute.
          baseMs = 60000 / wpm
        e.g. 350 wpm -> ~171 ms per word as the floor.

     2) lengthBonus: longer words need more time to recognise. We only start
        charging after a "free" length, then add a flat cost per extra
        character. Tune LEN_FREE (chars that are free) and LEN_PER_CHAR
        (ms added per character beyond that).

     3) punctuationBonus: trailing punctuation marks a phrase/sentence
        boundary, so we pause. A comma/semicolon/colon is a small pause;
        a sentence-ender (. ! ?) is a bigger pause; paragraph breaks add
        the most. These are EXTRA milliseconds on top of the word.

     Everything scales sensibly: lengthBonus and punctuationBonus are also
     divided down a touch at very high wpm via the SCALE factor so fast mode
     still feels fast. Set SCALE pieces to taste.
     ========================================================================= */

  // --- Tunable constants -------------------------------------------------
  var LEN_FREE      = 6;    // characters that cost no extra time
  var LEN_PER_CHAR  = 22;   // ms added per character beyond LEN_FREE
  var LEN_MAX_BONUS = 220;  // cap so one giant word can't stall forever

  var PUNCT_COMMA   = 120;  // , ; : —  small breath
  var PUNCT_SENT    = 320;  // . ! ?    sentence pause
  var PUNCT_PARA    = 500;  // blank line / paragraph break, biggest pause

  // At high wpm the bonuses feel heavy, so gently shrink them as speed rises.
  // factor = clamp(baseWpm / wpm, MIN, 1). At/below baseWpm -> full bonus.
  var BONUS_BASE_WPM = 300; // bonuses are "full strength" at this wpm
  var BONUS_MIN      = 0.45;

  /**
   * Compute dwell time (ms) for one token given current wpm.
   * @param {object} tok  {text, trailing, paraBreak}
   * @param {number} wpm
   */
  function dwellFor(tok, wpm) {
    var base = 60000 / wpm;

    // Bonus scaling factor for fast speeds.
    var factor = BONUS_BASE_WPM / wpm;
    if (factor > 1) factor = 1;
    if (factor < BONUS_MIN) factor = BONUS_MIN;

    // 2) length bonus — based on the visible word length (no punctuation).
    var len = tok.text.replace(/[^\w]/g, "").length;
    var lenBonus = Math.max(0, len - LEN_FREE) * LEN_PER_CHAR;
    if (lenBonus > LEN_MAX_BONUS) lenBonus = LEN_MAX_BONUS;

    // 3) punctuation bonus — look at the trailing punctuation we captured.
    var punctBonus = 0;
    if (tok.paraBreak) {
      punctBonus = PUNCT_PARA;
    } else if (/[.!?]["')\]]?$/.test(tok.trailing)) {
      punctBonus = PUNCT_SENT;
    } else if (/[,;:—–]$/.test(tok.trailing)) {
      punctBonus = PUNCT_COMMA;
    }

    return Math.round(base + (lenBonus + punctBonus) * factor);
  }

  /* =========================================================================
     TOKENISER
     Splits raw text into word tokens. We keep each word's trailing
     punctuation (for the pause logic) and flag whether a paragraph break
     (blank line / double newline) follows the word.
     ========================================================================= */
  function tokenize(raw) {
    var tokens = [];
    // Split into "paragraphs" on blank lines so we can flag paragraph breaks.
    var paras = raw.replace(/\r\n/g, "\n").split(/\n[ \t]*\n+/);
    for (var p = 0; p < paras.length; p++) {
      var words = paras[p].split(/\s+/).filter(Boolean);
      for (var i = 0; i < words.length; i++) {
        var w = words[i];
        // capture trailing punctuation cluster (e.g. "word!" -> "!", "end").
        var m = w.match(/([^\w]+)$/);
        var trailing = m ? m[1] : "";
        var isLastInPara = (i === words.length - 1);
        tokens.push({
          text: w,
          trailing: trailing,
          paraBreak: isLastInPara && p < paras.length - 1
        });
      }
    }
    return tokens;
  }

  /* =========================================================================
     PLAYER STATE
     ========================================================================= */
  var tokens = [];
  var index = 0;
  var playing = false;
  var timer = null;
  var wpm = 350;
  var view = "read"; // "read" | "present"

  // Default wpm per view (set on toggle / first load).
  var DEFAULT_WPM = { read: 350, present: 140 };

  // --- DOM refs ----------------------------------------------------------
  var $ = function (id) { return document.getElementById(id); };
  var elInput     = $("input");
  var elLoader    = $("loader");
  var elReadView  = $("readView");
  var elReadLine  = $("readLine");
  var elReadEmpty = $("readEmpty");
  var elPresent   = $("presentView");
  var elScroll    = $("presentScroll");
  var elPlay      = $("playPause");
  var elRestart   = $("restart");
  var elWpm       = $("wpm");
  var elWpmVal    = $("wpmVal");
  var elProgress  = $("progress");
  var elViewBtn   = $("viewToggle");
  var elFixation  = $("fixation");

  /* =========================================================================
     LOADING
     ========================================================================= */
  function load() {
    tokens = tokenize(elInput.value);
    index = 0;
    stop();
    var has = tokens.length > 0;
    elPlay.disabled = !has;
    elRestart.disabled = !has;
    if (has) {
      buildPresentDOM();
      elReadEmpty.style.display = "none";
      elReadLine.style.display = "flex";
      elFixation.style.display = view === "read" ? "block" : "none";
      elLoader.classList.add("hidden");
    } else {
      elReadEmpty.style.display = "flex";
      elReadLine.style.display = "none";
      elFixation.style.display = "none";
    }
    render();
  }

  /* =========================================================================
     RENDERING — READ (RSVP) view
     Shows the current word centred with 2 words of context on each side,
     dimmed. The centre word is anchored so it doesn't drift.
     ========================================================================= */
  function renderRead() {
    if (!tokens.length) return;
    elReadLine.innerHTML = "";
    for (var d = -2; d <= 2; d++) {
      var i = index + d;
      if (i < 0 || i >= tokens.length) continue;
      var span = document.createElement("span");
      span.textContent = tokens[i].text;
      if (d === 0) {
        span.className = "cur";
      } else {
        span.className = "ctx" + (Math.abs(d) === 1 ? " near" : "");
      }
      elReadLine.appendChild(span);
    }
  }

  /* =========================================================================
     RENDERING — PRESENT (teleprompter) view
     We render every word once as <w> elements, then on each step highlight
     the current word and scroll so it stays vertically centred.
     ========================================================================= */
  function buildPresentDOM() {
    elScroll.innerHTML = "";
    for (var i = 0; i < tokens.length; i++) {
      var w = document.createElement("w");
      w.textContent = tokens[i].text;
      w.dataset.i = i;
      elScroll.appendChild(w);
      // keep paragraph breaks visible as real line breaks
      if (tokens[i].paraBreak) {
        elScroll.appendChild(document.createElement("br"));
        elScroll.appendChild(document.createElement("br"));
      } else {
        elScroll.appendChild(document.createTextNode(" "));
      }
    }
  }

  function renderPresent() {
    if (!tokens.length) return;
    var nodes = elScroll.querySelectorAll("w");
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var ni = +n.dataset.i;
      n.className = ni === index ? "cur" : (ni < index ? "read" : "");
    }
    // Scroll so the current word's centre aligns to the viewport centre.
    var cur = nodes[index];
    if (cur) {
      var stageH = elPresent.clientHeight;
      var wordCentre = cur.offsetTop + cur.offsetHeight / 2;
      var offset = stageH / 2 - wordCentre;
      elScroll.style.transform = "translateY(" + offset + "px)";
    }
  }

  function render() {
    if (view === "read") renderRead();
    else renderPresent();
    var pct = tokens.length ? ((index + 1) / tokens.length) * 100 : 0;
    elProgress.style.width = pct + "%";
  }

  /* =========================================================================
     PLAYBACK LOOP
     Self-scheduling setTimeout so every word can have its own dwell time.
     ========================================================================= */
  function tick() {
    render();
    if (!playing) return;
    if (index >= tokens.length - 1) { stop(); return; }
    var dwell = dwellFor(tokens[index], wpm);
    timer = setTimeout(function () {
      index++;
      tick();
    }, dwell);
  }

  function play() {
    if (!tokens.length) return;
    if (index >= tokens.length - 1) index = 0; // restart if at end
    playing = true;
    elPlay.textContent = "Pause";
    tick();
  }

  function stop() {
    playing = false;
    elPlay.textContent = "Play";
    if (timer) { clearTimeout(timer); timer = null; }
  }

  function togglePlay() { playing ? stop() : play(); }

  function restart() {
    stop();
    index = 0;
    render();
  }

  function step(delta) {
    stop();
    index = Math.min(tokens.length - 1, Math.max(0, index + delta));
    render();
  }

  /* =========================================================================
     VIEW TOGGLE
     ========================================================================= */
  function setView(v) {
    view = v;
    var read = v === "read";
    elReadView.classList.toggle("hidden", !read);
    elPresent.classList.toggle("hidden", read);
    elFixation.style.display = read && tokens.length ? "block" : "none";
    elViewBtn.textContent = "View: " + (read ? "Read" : "Present");
    // Apply this view's default speed.
    setWpm(DEFAULT_WPM[v]);
    render();
  }

  function setWpm(v) {
    wpm = v;
    elWpm.value = v;
    elWpmVal.textContent = v;
  }

  /* =========================================================================
     EVENTS
     ========================================================================= */
  $("load").addEventListener("click", load);
  $("toggleLoader").addEventListener("click", function () {
    elLoader.classList.toggle("hidden");
  });
  elViewBtn.addEventListener("click", function () {
    setView(view === "read" ? "present" : "read");
  });
  elPlay.addEventListener("click", togglePlay);
  elRestart.addEventListener("click", restart);
  elWpm.addEventListener("input", function () {
    setWpm(+elWpm.value);
    // No need to restart the timer; the next scheduled tick uses new wpm.
  });

  document.addEventListener("keydown", function (e) {
    if (e.target === elInput) return; // don't hijack typing
    if (e.code === "Space") { e.preventDefault(); togglePlay(); }
    else if (e.code === "ArrowRight") { e.preventDefault(); step(1); }
    else if (e.code === "ArrowLeft") { e.preventDefault(); step(-1); }
    else if (e.key === "r" || e.key === "R") { restart(); }
  });

  window.addEventListener("resize", function () {
    if (view === "present") renderPresent();
  });

  // Init defaults.
  setWpm(DEFAULT_WPM.read);
})();
</script>
</body>
</html>
